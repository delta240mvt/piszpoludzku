<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">Pisz po ludzku</title>
  <desc id="desc">Redakcja polskich tekstów w Claude i Codexie. Twój sens. Twój głos. Lepszy tekst.</desc>
  <rect width="1280" height="560" rx="20" fill="#f4f0e8"/>
  <path d="M56 89H1224M56 470H1224" stroke="#cfc8bc"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="58" y="57" font-size="15" letter-spacing="3" fill="#48453e">PRACOWNIA DOBREGO TEKSTU</text>
    <text x="1222" y="57" text-anchor="end" font-size="14" letter-spacing="2" fill="#48453e">CLAUDE / CODEX</text>
    <text x="56" y="207" font-family="Georgia, 'Times New Roman', serif" font-size="108" letter-spacing="-5" fill="#22221e">Pisz po</text>
    <text x="52" y="327" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="124" letter-spacing="-6" fill="#22221e">ludzku.</text>
    <path d="M63 349C168 338 288 340 407 352" fill="none" stroke="#c95332" stroke-width="6" stroke-linecap="round"/>
    <text x="59" y="406" font-size="22" fill="#555149">Twój sens. Twój głos. Lepszy tekst.</text>
    <rect x="667" y="131" width="557" height="288" rx="8" fill="#e9e3d8"/>
    <text x="699" y="170" font-size="12" letter-spacing="2" fill="#70695f">PRZED</text>
    <g fill="#7b7369" font-size="23">
      <text x="699" y="211">W celu dokonania zmiany hasła</text>
      <text x="699" y="244">konieczne jest przejście do ustawień.</text>
    </g>
    <path d="M699 273H1192" stroke="#c9c0b2"/>
    <text x="699" y="309" font-size="12" letter-spacing="2" fill="#a64228">PO REDAKCJI</text>
    <g fill="#25251f" font-size="26">
      <text x="699" y="351">Żeby zmienić hasło,</text>
      <text x="699" y="387">przejdź do ustawień.</text>
    </g>
    <text x="58" y="513" font-size="14" letter-spacing="1" fill="#48453e">POLSKIE TEKSTY. UWAŻNA REDAKCJA.</text>
    <circle cx="1010" cy="508" r="5" fill="#c95332"/>
    <text x="1030" y="513" font-size="14" letter-spacing="1" fill="#48453e">BY DELTA240MVT</text>
  </g>
</svg>
